
name: Refresh UX job board

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and filter job listings
        run: python fetch_jobs.py

      - name: Save updated listings
        run: |
          git config user.name "ux-radar-bot"
          git config user.email "ux-radar-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m "Refresh job feed" && git push)
